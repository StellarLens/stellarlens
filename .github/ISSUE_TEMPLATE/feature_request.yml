name: Feature request
description: Suggest an idea or improvement for stellarlens
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! There's no such thing as a request
        that's too small or too early-stage to share — half-formed ideas are
        welcome.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Is this related to something you ran into? Describe the situation.
      placeholder: I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or change you're imagining.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches or workarounds you've thought about.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Additional context, links, or screenshots. Feel free to leave this blank.
    validations:
      required: false
