name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stellarlens
          POSTGRES_PASSWORD: stellarlens
          POSTGRES_DB: stellarlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellarlens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test
        env:
          DATABASE_URL: postgres://stellarlens:stellarlens@localhost:5432/stellarlens
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK: testnet
